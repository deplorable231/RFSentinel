name: Build C5 UART test APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/c5-uart-test.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get verified RF Sentinel 2.26.0 source
        uses: actions/checkout@v4
        with:
          repository: CIS-C0/RFSentinel
          ref: b820fac8849a598e8551f2e8f7d514e240dfcc85
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Check available Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Apply verified CH343 CDC fix
        env:
          PATCH_B64: 
          TEST_B64: 
        run: |
          python3 - <<'PYCODE'
          import os, base64, hashlib, pathlib, subprocess
          path = pathlib.Path('app/src/main/java/com/rfsentinel/app/esp/SerialPort.kt')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == 'a16d56637aac3c48b4229f09791503b679fc764fded62a71582883cdfbb9e309', 'Unexpected upstream source'
          pathlib.Path('/tmp/c5.patch').write_bytes(base64.b64decode(os.environ['PATCH_B64']))
          subprocess.run(['git','apply','--check','/tmp/c5.patch'],check=True)
          subprocess.run(['git','apply','/tmp/c5.patch'],check=True)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '48cba6fd8973b7259d107f129b3859af7296fb82496b310c5688975ef11ffb23'
          test = pathlib.Path('app/src/test/java/com/rfsentinel/app/esp/SerialPortChipTest.kt')
          test.write_bytes(base64.b64decode(os.environ['TEST_B64']))
          label = pathlib.Path('app/src/debug/res/values/c5_test_label.xml')
          label.parent.mkdir(parents=True, exist_ok=True)
          label.write_text('<resources><string name="app_name">RF Sentinel C5 Test</string></resources>')
          PYCODE
      - name: Test serial detection and Marauder reader; build separate debug app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest --tests 'com.rfsentinel.app.esp.SerialPortChipTest' --tests 'com.rfsentinel.app.esp.EspReaderTest' :app:assembleDebug
      - name: Upload test APK and relevant sources
        uses: actions/upload-artifact@v4
        with:
          name: RFSentinel-C5-UART-Test
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/src/main/java/com/rfsentinel/app/esp/SerialPort.kt
            app/src/test/java/com/rfsentinel/app/esp/SerialPortChipTest.kt
            LICENSE
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C5-UART-test-reports
          if-no-files-found: ignore
          retention-days: 14
          path: app/build/reports/tests/
